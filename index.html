<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>🟢 Simple Snake Game</title>
  <style>
    /* -------------------------------------------------
       Minimalist green theme – classic vibe.
       ------------------------------------------------- */
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f7fafc;      /* light background */
      color: #2d3748;
    }
    h1 {
      margin-top: 1rem;
      font-size: 2rem;
      color: #2f855a;
    }
    #gameCanvas {
      border: 2px solid #2f855a;
      background: #fff;
      margin-top: 1rem;
    }
    #info {
      margin-top: 0.5rem;
      font-size: 0.9rem;
    }
    button {
      margin-top: 1rem;
      padding: 0.5rem 1rem;
      font-size: 1rem;
      background: #48bb78;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #38a169;
    }
  </style>
</head>
<body>
  <h1>🐍 Simple Snake</h1>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <div id="info">Use the arrow keys (or WASD) to move. Press <strong>Space</strong> to restart.</div>
  <script>
    // -------------------------------------------------
    // Game configuration – classic green design
    // -------------------------------------------------
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const CELL_SIZE = 20;                     // each square size (px)
    const COLS = canvas.width / CELL_SIZE;
    const ROWS = canvas.height / CELL_SIZE;
    const FPS = 10;                           // normal speed (frames per second)

    // -------------------------------------------------
    // Game state
    // -------------------------------------------------
    let snake = [];
    let direction = { x: 1, y: 0 };
    let food = null;
    let timer = null;
    let score = 0;
    let gameOver = false;

    // -------------------------------------------------
    // Helper utilities
    // -------------------------------------------------
    function randomCell() {
      return {
        x: Math.floor(Math.random() * COLS),
        y: Math.floor(Math.random() * ROWS)
      };
    }

    function initGame() {
      // Reset everything
      snake = [{ x: Math.floor(COLS / 2), y: Math.floor(ROWS / 2) }];
      direction = { x: 1, y: 0 };
      food = randomCell();
      score = 0;
      gameOver = false;
      // Ensure fruit not on snake
      while (snake.some(p => p.x === food.x && p.y === food.y)) {
        food = randomCell();
      }
      clearInterval(timer);
      timer = setInterval(gameLoop, 1000 / FPS);
      render();
    }

    function gameLoop() {
      if (gameOver) return;

      // Compute new head position (wrap around edges)
      const newHead = {
        x: (snake[0].x + direction.x + COLS) % COLS,
        y: (snake[0].y + direction.y + ROWS) % ROWS
      };

      // Collision with self?
      if (snake.some(seg => seg.x === newHead.x && seg.y === newHead.y)) {
        endGame();
        return;
      }

      snake.unshift(newHead); // add new head

      // Fruit consumption?
      if (newHead.x === food.x && newHead.y === food.y) {
        score++;
        // relocate fruit, avoid snake body
        do {
          food = randomCell();
        } while (snake.some(p => p.x === food.x && p.y === food.y));
      } else {
        snake.pop(); // move without growing
      }

      render();
    }

    function render() {
      // Clear board (white background)
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw fruit – red circle for classic look
      ctx.fillStyle = '#e53e3e';
      ctx.beginPath();
      ctx.arc(
        food.x * CELL_SIZE + CELL_SIZE / 2,
        food.y * CELL_SIZE + CELL_SIZE / 2,
        CELL_SIZE / 2 - 2,
        0,
        Math.PI * 2
      );
      ctx.fill();

      // Draw snake – green head and body
      snake.forEach((seg, i) => {
        ctx.fillStyle = i === 0 ? '#48bb78' : '#38a169';
        ctx.fillRect(seg.x * CELL_SIZE, seg.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
      });

      // Score overlay
      ctx.fillStyle = '#2d3748';
      ctx.font = '16px sans-serif';
      ctx.fillText(`Score: ${score}`, 10, canvas.height - 10);
    }

    function endGame() {
      gameOver = true;
      clearInterval(timer);
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fff';
      ctx.font = '24px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2 - 10);
      ctx.font = '16px sans-serif';
      ctx.fillText(`Score: ${score}`, canvas.width / 2, canvas.height / 2 + 20);
    }

    // -------------------------------------------------
    // Input handling – arrow keys + WASD, space to restart
    // -------------------------------------------------
    const keyMap = {
      ArrowUp:    { x: 0, y: -1 },
      ArrowDown:  { x: 0, y: 1 },
      ArrowLeft:  { x: -1, y: 0 },
      ArrowRight: { x: 1, y: 0 },
      w: { x: 0, y: -1 },
      s: { x: 0, y: 1 },
      a: { x: -1, y: 0 },
      d: { x: 1, y: 0 }
    };
    document.addEventListener('keydown', e => {
      if (e.key === ' ') {
        initGame(); // Space restarts the game
        return;
      }
      const newDir = keyMap[e.key];
      if (!newDir) return;
      // Prevent reversing direction directly (snake would bite itself)
      if (snake.length > 1 && newDir.x === -direction.x && newDir.y === -direction.y) {
        return;
      }
      direction = newDir;
    });

    // Auto‑start the game when page loads
    initGame();
  </script>
</body>
</html>
