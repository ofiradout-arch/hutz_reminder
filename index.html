<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>⚪️ Animated Black & White Snake</title>
  <style>
    /* -------------------------------------------------
       Minimalist black‑and‑white design – classic vibe.
       ------------------------------------------------- */
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #000;      /* black background */
      color: #fff;          /* white text */
    }
    h1 {
      margin-top: 1rem;
      font-size: 2rem;
      color: #fff;
    }
    #gameCanvas {
      border: 2px solid #fff;
      background: #111;    /* very dark playing field */
      margin-top: 1rem;
    }
    #info {
      margin-top: 0.5rem;
      font-size: 0.9rem;
    }
    button {
      margin-top: 1rem;
      padding: 0.5rem 1rem;
      font-size: 1rem;
      background: #444;    /* dark button */
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #666;
    }
  </style>
</head>
<body>
  <h1>🐍 Animated Black &amp; White Snake</h1>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <div id="info">Use arrow keys (or WASD) to move. Press <strong>Space</strong> to restart.</div>
  <button id="startBtn">Start Game</button>
  <button id="restartBtn" style="display:none;">Restart</button>

  <script>
    // -------------------------------------------------
    // Game configuration – slower, animated movement
    // -------------------------------------------------
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const CELL_SIZE = 20;                    // each cell in pixels
    const COLS = canvas.width / CELL_SIZE;
    const ROWS = canvas.height / CELL_SIZE;
    const MOVE_INTERVAL = 200;                // ms between logical moves (5 moves/sec)
    const FRUIT_SCALE_TIME = 150;            // ms for fruit grow animation

    // -------------------------------------------------
    // Game state
    // -------------------------------------------------
    let snake = [];               // current grid positions (objects {x,y})
    let snakePrev = [];           // previous grid positions for interpolation
    let snakeTarget = [];         // target grid positions after last move
    let direction = { x: 1, y: 0 };
    let food = null;              // fruit grid position
    let foodSpawnTime = 0;        // timestamp used for fruit scaling animation
    let lastMove = 0;             // timestamp of last logical move
    let score = 0;
    let gameOver = false;
    let animReq = null;

    // -------------------------------------------------
    // Helper utilities
    // -------------------------------------------------
    function randomCell() {
      return {
        x: Math.floor(Math.random() * COLS),
        y: Math.floor(Math.random() * ROWS)
      };
    }

    function startGame() {
      // Reset state
      snake = [{ x: Math.floor(COLS / 2), y: Math.floor(ROWS / 2) }];
      direction = { x: 1, y: 0 };
      food = randomCell();
      // Ensure fruit not on snake
      while (snake.some(p => p.x === food.x && p.y === food.y)) {
        food = randomCell();
      }
      foodSpawnTime = performance.now();
      score = 0;
      gameOver = false;
      lastMove = performance.now();
      snakePrev = snake.map(p => ({ ...p }));
      snakeTarget = snake.map(p => ({ ...p }));

      // UI adjustments
      document.getElementById('startBtn').style.display = 'none';
      document.getElementById('restartBtn').style.display = 'inline-block';

      // Begin animation loop
      if (!animReq) animReq = requestAnimationFrame(gameLoop);
    }

    function gameLoop(timestamp) {
      // Calculate how far we are into the current move interval
      const delta = timestamp - lastMove;
      let t = delta / MOVE_INTERVAL;
      if (t > 1) t = 1; // capped for drawing interpolation

      // If enough time has passed, perform a logical move
      if (delta >= MOVE_INTERVAL) {
        // Store previous positions for interpolation
        snakePrev = snakeTarget.map(p => ({ ...p }));

        // Compute new head position (wrap around edges)
        const newHead = {
          x: (snake[0].x + direction.x + COLS) % COLS,
          y: (snake[0].y + direction.y + ROWS) % ROWS
        };

        // Self‑collision?
        if (snake.some(seg => seg.x === newHead.x && seg.y === newHead.y)) {
          endGame(timestamp);
          return; // stop further processing – game over overlay will be shown
        }

        // Insert new head
        snake.unshift(newHead);
        let ate = false;
        // Fruit consumption?
        if (newHead.x === food.x && newHead.y === food.y) {
          ate = true;
          score++;
          // Place new fruit, avoid snake body
          do {
            food = randomCell();
          } while (snake.some(p => p.x === food.x && p.y === food.y));
          foodSpawnTime = timestamp; // reset fruit animation timer
        }
        // If not eating, remove tail to keep length constant
        if (!ate) snake.pop();

        // Update target positions for interpolation
        snakeTarget = snake.map(p => ({ ...p }));
        // Reset timer for next logical move
        lastMove = timestamp;
        // Re‑calculate t for immediate draw after move (t = 0)
        t = 0;
      }

      // -------------------------------------------------
      // Rendering – interpolated positions for smooth movement
      // -------------------------------------------------
      // Clear board (dark field)
      ctx.fillStyle = '#111';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw fruit with simple grow animation
      const fruitAge = timestamp - foodSpawnTime;
      const fruitScale = Math.min(1, fruitAge / FRUIT_SCALE_TIME);
      const fruitCx = food.x * CELL_SIZE + CELL_SIZE / 2;
      const fruitCy = food.y * CELL_SIZE + CELL_SIZE / 2;
      ctx.fillStyle = '#e53e3e'; // red fruit
      ctx.save();
      ctx.translate(fruitCx, fruitCy);
      ctx.scale(fruitScale, fruitScale);
      ctx.beginPath();
      ctx.arc(0, 0, CELL_SIZE / 2 - 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Draw snake – interpolate each segment between previous and target
      for (let i = 0; i < snakeTarget.length; i++) {
        const start = snakePrev[i] || snakeTarget[i]; // first frame fallback
        const end = snakeTarget[i];
        const ix = start.x + (end.x - start.x) * t;
        const iy = start.y + (end.y - start.y) * t;
        ctx.fillStyle = i === 0 ? '#fff' : '#ddd'; // head brighter
        ctx.fillRect(ix * CELL_SIZE, iy * CELL_SIZE, CELL_SIZE, CELL_SIZE);
      }

      // Score overlay
      ctx.fillStyle = '#fff';
      ctx.font = '16px sans-serif';
      ctx.fillText(`Score: ${score}`, 10, canvas.height - 10);

      // Continue animation unless game over
      if (!gameOver) {
        animReq = requestAnimationFrame(gameLoop);
      }
    }

    function endGame(timestamp) {
      gameOver = true;
      // Draw final overlay (fade‑in effect)
      const overlayAlpha = Math.min(0.7, (timestamp - lastMove) / 300);
      ctx.fillStyle = `rgba(0,0,0,${overlayAlpha})`;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fff';
      ctx.font = '24px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2 - 10);
      ctx.font = '16px sans-serif';
      ctx.fillText(`Score: ${score}`, canvas.width / 2, canvas.height / 2 + 20);

      // Show start button again, hide restart button
      document.getElementById('startBtn').style.display = 'inline-block';
      document.getElementById('restartBtn').style.display = 'none';
    }

    // -------------------------------------------------
    // Input handling – arrow keys & WASD, plus space to restart
    // -------------------------------------------------
    const keyMap = {
      ArrowUp:    { x: 0, y: -1 },
      ArrowDown:  { x: 0, y: 1 },
      ArrowLeft:  { x: -1, y: 0 },
      ArrowRight: { x: 1, y: 0 },
      w: { x: 0, y: -1 },
      s: { x: 0, y: 1 },
      a: { x: -1, y: 0 },
      d: { x: 1, y: 0 }
    };
    document.addEventListener('keydown', e => {
      if (e.key === ' ') { // Space restarts same as restart button
        startGame();
        return;
      }
      const newDir = keyMap[e.key];
      if (!newDir) return;
      // Prevent direct reversal which would cause immediate self‑collision
      if (snake.length > 1 && newDir.x === -direction.x && newDir.y === -direction.y) return;
      direction = newDir;
    });

    // Button actions
    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('restartBtn').addEventListener('click', startGame);

    // No auto‑start; user must click "Start Game"
  </script>
</body>
</html>
